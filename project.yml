name: OnThisDay
options:
  bundleIdPrefix: com.wong2
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
targets:
  OnThisDay:
    type: application
    platform: iOS
    sources: [OnThisDay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wong2.OnThisDay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: On This Day
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Find your photos from this day in past years. Your library stays private and is never uploaded."
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  OnThisDayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OnThisDayTests]
    dependencies:
      - target: OnThisDay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OnThisDay:
    build:
      targets:
        OnThisDay: all
        OnThisDayTests: [test]
    test:
      targets: [OnThisDayTests]
